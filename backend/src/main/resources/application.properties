spring.application.name=backend
server.port=${PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=never

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true
spring.flyway.default-schema=public
spring.flyway.url=${FLYWAY_DB_URL:${DB_URL}}
spring.flyway.user=${FLYWAY_DB_USERNAME:${DB_USERNAME}}
spring.flyway.password=${FLYWAY_DB_PASSWORD:${DB_PASSWORD}}
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.cors.frontend-url=${FRONTEND_URL:http://localhost:3000}
# Reserved for the future JWT authentication implementation; expiration is in milliseconds.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:3600000}

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
