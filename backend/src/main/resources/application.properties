spring.application.name=backend
server.port=${PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=never

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true
spring.flyway.default-schema=public
spring.flyway.url=${FLYWAY_DB_URL:${DB_URL}}
spring.flyway.user=${FLYWAY_DB_USERNAME:${DB_USERNAME}}
spring.flyway.password=${FLYWAY_DB_PASSWORD:${DB_PASSWORD}}
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.cors.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.dashboard.time-zone=${DASHBOARD_TIME_ZONE:UTC}
# JWT_SECRET is Base64-encoded random key material (at least 32 decoded bytes).
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:900000}
app.jwt.issuer=task-management-system
app.jwt.audience=task-management-api

# Keep credential request bodies and JDBC bind values out of framework debug logs.
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestResponseBodyMethodProcessor=INFO
logging.level.org.springframework.jdbc.core.StatementCreatorUtils=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
